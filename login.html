<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log Masuk - Inventori & POS</title>
<link rel="icon" type="image/png" href="logomdp.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#020f16;--cyan:#22d3ee;--cyan2:#67e8f9;--teal:#2dd4bf;--line:rgba(34,211,238,.22);--txt:#e6fbff;--muted:#72a6b1;--red:#fb7185}*{box-sizing:border-box;font-family:"Century Gothic",CenturyGothic,AppleGothic,sans-serif}html,body{min-height:100%;margin:0}body{overflow:hidden;color:var(--txt);background:radial-gradient(circle at 50% 15%,#0a3d4d 0,#04232f 23%,#031720 52%,#020d13 100%)}.scene{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px;isolation:isolate}.scene:before{content:"";position:absolute;inset:0;z-index:-5;background:linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 90%)}.ambient{position:absolute;border-radius:999px;filter:blur(70px);opacity:.18;z-index:-4;animation:ambientMove 10s ease-in-out infinite alternate}.ambient.a{width:480px;height:480px;background:#22d3ee;left:-160px;top:-160px}.ambient.b{width:390px;height:390px;background:#0d9488;right:-100px;bottom:-130px;animation-delay:-4s}.parts{position:absolute;inset:0;overflow:hidden;z-index:-3;pointer-events:none}.part{position:absolute;color:#67e8f9;opacity:.075;filter:blur(1.2px) drop-shadow(0 0 16px rgba(34,211,238,.55));animation:partFloat 8s ease-in-out infinite}.part i{font-size:clamp(40px,5vw,78px)}.part.p1{left:7%;top:18%;animation-delay:-1s}.part.p2{right:8%;top:14%;animation-delay:-3s}.part.p3{left:10%;bottom:15%;animation-delay:-5s}.part.p4{right:11%;bottom:11%;animation-delay:-2s}.part.p5{left:25%;top:7%;animation-delay:-6s}.part.p6{right:25%;bottom:4%;animation-delay:-4s}.wrap{width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);border:1px solid rgba(34,211,238,.20);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(6,38,50,.78),rgba(2,18,26,.88));box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 0 45px rgba(34,211,238,.025);backdrop-filter:blur(18px)}.hero{position:relative;min-height:590px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-right:1px solid rgba(34,211,238,.13)}.hero:before{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(34,211,238,.10);border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);box-shadow:0 0 65px rgba(34,211,238,.04),inset 0 0 65px rgba(34,211,238,.03);animation:ringPulse 5s ease-in-out infinite}.hero:after{content:"";position:absolute;width:320px;height:320px;border:1px dashed rgba(34,211,238,.10);border-radius:50%;left:50%;top:48%;animation:ringSpin 30s linear infinite}.brand{position:relative;z-index:2}.eyebrow{font-size:10px;letter-spacing:.22em;color:#4ec5d4;font-weight:900}.brand h1{font-size:32px;line-height:1.15;margin:10px 0 7px;color:#f0fdff;text-shadow:0 0 18px rgba(34,211,238,.20)}.brand p{margin:0;color:#669aa5;font-size:11px}.bike-stage{position:relative;height:280px;z-index:2;display:grid;place-items:center}.bike-glow{position:absolute;width:300px;height:85px;border-radius:50%;bottom:24px;background:rgba(34,211,238,.14);filter:blur(28px);animation:bikeShadow 3.8s ease-in-out infinite}.bike{position:relative;font-size:130px;color:#8ff3ff;text-shadow:0 0 8px rgba(34,211,238,.55),0 0 22px rgba(34,211,238,.28),0 0 55px rgba(34,211,238,.12);animation:bikeFloat 3.8s ease-in-out infinite}.bike:after{content:"";position:absolute;left:16%;right:16%;bottom:-9px;height:2px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 10px #22d3ee;animation:scanLine 2.5s ease-in-out infinite}.hero-bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:15px;color:#477c87;font-size:9px}.online{display:flex;align-items:center;gap:7px;color:#5eead4}.dot{width:7px;height:7px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf;animation:dotPulse 1.8s ease-in-out infinite}.login-panel{padding:46px 42px;display:flex;align-items:center;background:linear-gradient(180deg,rgba(3,25,35,.82),rgba(2,16,23,.93))}.login-inner{width:100%}.login-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:12px;color:#cffafe;background:linear-gradient(145deg,rgba(34,211,238,.15),rgba(5,50,63,.42));border:1px solid rgba(34,211,238,.27);box-shadow:inset 0 0 14px rgba(34,211,238,.05),0 0 15px rgba(34,211,238,.10);font-size:19px;margin-bottom:18px;animation:loginIcon 4s ease-in-out infinite}.login-title{font-size:23px;font-weight:900;margin:0;color:#f0fdff}.login-sub{font-size:10px;color:#5e939e;margin:6px 0 24px}.field-group{margin-bottom:14px}.label{display:block;color:#79cbd5;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.input-wrap{position:relative}.input-wrap>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#4fb3bf;font-size:12px;pointer-events:none}.input{width:100%;height:46px;padding:0 42px 0 38px;border:1px solid rgba(34,211,238,.19);border-radius:8px;outline:none;background:rgba(2,20,28,.82);color:#e6fbff;font-size:12px;transition:.2s}.input::placeholder{color:#3f707a}.input:focus{border-color:rgba(34,211,238,.60);box-shadow:0 0 0 3px rgba(34,211,238,.055),0 0 18px rgba(34,211,238,.05)}.toggle-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:#4f8791;cursor:pointer}.toggle-pass:hover{color:#a5f3fc}.remember{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 20px;font-size:9px;color:#5f929d}.remember label{display:flex;align-items:center;gap:7px;cursor:pointer}.remember input{accent-color:#0891a3}.btn{position:relative;width:100%;height:47px;border:1px solid #22d3ee;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#0891a3,#0f766e);color:#fff;font-size:11px;font-weight:900;letter-spacing:.05em;cursor:pointer;box-shadow:0 10px 28px rgba(8,145,163,.14);transition:.22s}.btn:before{content:"";position:absolute;top:0;bottom:0;width:70px;left:-85px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg)}.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(34,211,238,.18)}.btn:hover:before{animation:buttonScan .8s ease}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.error{display:none;margin-top:13px;padding:10px 11px;border-radius:7px;border:1px solid rgba(251,113,133,.25);background:rgba(251,113,133,.06);color:#fda4af;font-size:9px}.error.show{display:block}.secure{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:17px;color:#3e727c;font-size:8px}.secure i{color:#399aaa}.loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:7px;animation:spin .7s linear infinite}.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:12px 15px;border-radius:8px;background:#05202b;border:1px solid #2dd4bf;color:#dffcff;box-shadow:0 16px 45px rgba(0,0,0,.32);font-size:10px;display:none}.toast.show{display:block}@keyframes ambientMove{to{transform:translate(45px,30px) scale(1.1)}}@keyframes partFloat{0%,100%{transform:translateY(0) rotate(-4deg);opacity:.055}50%{transform:translateY(-15px) rotate(4deg);opacity:.10}}@keyframes ringPulse{50%{transform:translate(-50%,-50%) scale(1.035);border-color:rgba(34,211,238,.17)}}@keyframes ringSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes bikeFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@keyframes bikeShadow{50%{transform:scale(.84);opacity:.65}}@keyframes scanLine{50%{left:5%;right:5%;opacity:.55}}@keyframes dotPulse{50%{opacity:.45;box-shadow:0 0 15px #2dd4bf}}@keyframes loginIcon{50%{transform:translateY(-3px);box-shadow:inset 0 0 15px rgba(34,211,238,.07),0 0 19px rgba(34,211,238,.15)}}@keyframes buttonScan{to{left:110%}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:860px){body{overflow:auto}.scene{padding:14px}.wrap{grid-template-columns:1fr;max-width:520px}.hero{min-height:310px;padding:30px;border-right:0;border-bottom:1px solid rgba(34,211,238,.13)}.bike-stage{height:155px}.bike{font-size:92px}.hero:before{width:260px;height:260px}.hero:after{width:205px;height:205px}.login-panel{padding:32px 30px}}@media(max-width:520px){.scene{padding:0;display:block}.wrap{min-height:100vh;border:0;border-radius:0}.hero{min-height:285px;padding:25px 22px}.brand h1{font-size:25px}.bike-stage{height:135px}.bike{font-size:78px}.login-panel{padding:30px 22px 48px}.part{opacity:.04}}@media(prefers-reduced-motion:reduce){.ambient,.part,.hero:before,.hero:after,.bike,.bike-glow,.bike:after,.dot,.login-icon{animation:none!important}}
</style>
</head>
<body>
<div class="scene">
<div class="ambient a"></div><div class="ambient b"></div>
<div class="parts" aria-hidden="true"><span class="part p1"><i class="fa-solid fa-gear"></i></span><span class="part p2"><i class="fa-solid fa-gears"></i></span><span class="part p3"><i class="fa-solid fa-oil-can"></i></span><span class="part p4"><i class="fa-solid fa-screwdriver-wrench"></i></span><span class="part p5"><i class="fa-solid fa-bolt"></i></span><span class="part p6"><i class="fa-solid fa-wrench"></i></span></div>
<div class="wrap">
<section class="hero"><div class="brand"><div class="eyebrow">SPAREPART MOTORCYCLE SYSTEM</div><h1>INVENTORI &amp; POS</h1><p>Pengurusan sparepart, stok dan jualan dalam satu sistem.</p></div><div class="bike-stage" aria-hidden="true"><div class="bike-glow"></div><div class="bike"><i class="fa-solid fa-motorcycle"></i></div></div><div class="hero-bottom"><div class="online"><span class="dot"></span> SISTEM SEDIA</div><span>SECURE ACCESS · INVENTORY CONTROL</span></div></section>
<section class="login-panel"><div class="login-inner"><div class="login-icon"><i class="fa-solid fa-fingerprint"></i></div><h2 class="login-title">LOG MASUK</h2><div class="login-sub">Masukkan No. Pekerja dan kata laluan untuk meneruskan.</div><form id="loginForm" autocomplete="on"><div class="field-group"><label class="label" for="noPekerja">No. Pekerja</label><div class="input-wrap"><i class="fa-solid fa-id-card"></i><input id="noPekerja" name="username" class="input" type="text" autocomplete="username" placeholder="Contoh: AP001" required maxlength="80"></div></div><div class="field-group"><label class="label" for="password">Kata Laluan</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" name="password" class="input" type="password" autocomplete="current-password" placeholder="Masukkan kata laluan" required maxlength="200"><button id="togglePass" class="toggle-pass" type="button" aria-label="Papar kata laluan"><i class="fa-solid fa-eye"></i></button></div></div><div class="remember"><label><input id="rememberNo" type="checkbox"> Ingat No. Pekerja</label><span><i class="fa-solid fa-shield-halved"></i> Akses pengguna berdaftar</span></div><button id="btnLogin" class="btn" type="submit">LOG MASUK &nbsp; <i class="fa-solid fa-arrow-right-to-bracket"></i></button><div id="errorBox" class="error"></div></form><div class="secure"><i class="fa-solid fa-lock"></i> INVENTORI &amp; POS · SECURE LOGIN</div></div></section>
</div></div><div id="toast" class="toast"></div>
<script>
const db=window.supabaseClient;const el=id=>document.getElementById(id);let toastTimer=null;
document.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('ingat_no_pekerja');if(saved){el('noPekerja').value=saved;el('rememberNo').checked=true}el('loginForm').addEventListener('submit',login);el('togglePass').addEventListener('click',togglePassword);el('noPekerja').focus()});
function togglePassword(){const p=el('password'),icon=el('togglePass').querySelector('i'),show=p.type==='password';p.type=show?'text':'password';icon.className='fa-solid '+(show?'fa-eye-slash':'fa-eye');el('togglePass').setAttribute('aria-label',show?'Sembunyikan kata laluan':'Papar kata laluan')}
async function login(e){e.preventDefault();hideError();if(!db)return showError('Supabase tidak tersedia. Semak supabase-config.js');const no=el('noPekerja').value.trim(),password=el('password').value;if(!no||!password)return showError('Sila masukkan No. Pekerja dan kata laluan.');setLoginLoading(true);try{const r=await db.from('pengguna').select('id,no_pekerja,nama,password,jawatan,unit,status').eq('no_pekerja',no).limit(1);if(r.error)throw r.error;const user=r.data?.[0];if(!user||String(user.password)!==String(password))throw new Error('No. Pekerja atau kata laluan tidak betul.');if(String(user.status||'').trim().toUpperCase()!=='AKTIF')throw new Error('Akaun pengguna tidak aktif. Sila hubungi pentadbir.');const session={id:user.id,no_pekerja:user.no_pekerja,nama:user.nama,jawatan:user.jawatan,unit:user.unit,status:user.status,login_at:new Date().toISOString()};localStorage.setItem('mdp_user',JSON.stringify(session));localStorage.setItem('pengguna',JSON.stringify(session));if(el('rememberNo').checked)localStorage.setItem('ingat_no_pekerja',no);else localStorage.removeItem('ingat_no_pekerja');showToast('Log masuk berjaya. Membuka Dashboard...');setTimeout(()=>{window.location.replace('dashboard.html')},450)}catch(err){console.error('RALAT LOGIN:',err);showError(err.message||'Log masuk gagal. Sila cuba lagi.')}finally{setLoginLoading(false)}}
function setLoginLoading(on){el('btnLogin').disabled=on;el('btnLogin').innerHTML=on?'<span class="loader"></span> MEMERIKSA AKAUN...':'LOG MASUK &nbsp; <i class="fa-solid fa-arrow-right-to-bracket"></i>'}function showError(text){el('errorBox').textContent=text;el('errorBox').classList.add('show')}function hideError(){el('errorBox').textContent='';el('errorBox').classList.remove('show')}function showToast(text){el('toast').textContent=text;el('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3500)}
</script>
</body>
</html>
