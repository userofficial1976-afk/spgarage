<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Kategori — Inventori & POS
</title>

<link
    rel="icon"
    type="image/png"
    href="logomdp.png"
>

<!-- =====================================================
     TAILWIND CSS
===================================================== -->

<script src="https://cdn.tailwindcss.com"></script>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --bg: #03141d;

    --panel: #06212d;

    --panel2: #082a38;

    --line: rgba(34,211,238,.24);

    --cyan: #22d3ee;

    --teal: #2dd4bf;

    --muted: #7ca4b2;

    --txt: #e6fbff;

    --red: #fb7185;

    --amber: #fbbf24;

}


/* =========================================================
   GLOBAL
========================================================= */

* {

    box-sizing: border-box;

    font-family:
        "Century Gothic",
        CenturyGothic,
        AppleGothic,
        sans-serif;

}


html {

    scroll-behavior: smooth;

}


body {

    margin: 0;

    background:
        radial-gradient(
            circle at 50% 5%,
            #073344 0,
            #03141d 44%,
            #020e15 100%
        );

    color: var(--txt);

    min-height: 100vh;

}


/* =========================================================
   MAIN
========================================================= */

.main {

    margin-left: 288px;

    min-height: 100vh;

}


.content {

    max-width: 1700px;

    margin: auto;

    padding: 20px;

}


/* =========================================================
   HUD / PANEL
========================================================= */

.hud {

    background:
        linear-gradient(
            180deg,
            rgba(8,42,56,.90),
            rgba(3,25,35,.90)
        );

    border:
        1px solid var(--line);

    box-shadow:
        inset 0 0 28px
        rgba(34,211,238,.025),

        0 0 20px
        rgba(0,0,0,.24);

    border-radius: 9px;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    text-align: center;

    padding: 17px 20px;

    margin-bottom: 13px;

    position: relative;

}


.header::after {

    content: "";

    position: absolute;

    left: 5%;

    right: 5%;

    bottom: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #22d3ee,
            transparent
        );

}


.title {

    font-size: 27px;

    font-weight: 900;

    text-shadow:
        0 0 14px
        rgba(34,211,238,.3);

}


.sub {

    font-size: 11px;

    color: #59b9c8;

    margin-top: 4px;

}


/* =========================================================
   STATISTICS
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-bottom: 12px;

}


.stat {

    padding: 16px;

}


.stat .k {

    font-size: 10px;

    color: #4cc4cf;

    text-transform: uppercase;

    letter-spacing: .05em;

}


.stat .v {

    font-size: 24px;

    font-weight: 800;

    margin-top: 5px;

}


/* =========================================================
   DASHBOARD
========================================================= */

.dash {

    display: grid;

    grid-template-columns:
        330px
        minmax(0, 1fr);

    gap: 12px;

    margin-bottom: 13px;

}


.panel {

    padding: 14px;

}


/* =========================================================
   PANEL TITLE
========================================================= */

.ph {

    font-size: 13px;

    font-weight: 800;

    color: #b9f6ff;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 8px;

}


.ph::before {

    content: "";

    width: 5px;

    height: 18px;

    background: #22d3ee;

    box-shadow:
        0 0 10px #22d3ee;

    transform:
        skew(-15deg);

}


/* =========================================================
   STATUS PROGRESS
========================================================= */

.metric {

    display: flex;

    justify-content:
        space-between;

    font-size: 11px;

    margin: 10px 0;

}


.bar {

    height: 10px;

    background: #0c3442;

    border:
        1px solid
        rgba(34,211,238,.15);

    padding: 1px;

}


.bar i {

    display: block;

    height: 100%;

    background: #22d3ee;

    box-shadow:
        0 0 5px
        rgba(34,211,238,.5);

}


/* =========================================================
   CATEGORY RANKING
========================================================= */

.rankgrid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 7px;

}


.rank {

    padding: 10px;

    background:
        rgba(5,33,44,.7);

    border:
        1px solid
        rgba(34,211,238,.10);

    border-radius: 6px;

}


.rankline {

    display: flex;

    justify-content:
        space-between;

    gap: 8px;

    font-size: 10px;

}


.rankline b:last-child {

    color: #22d3ee;

}


.mini {

    font-size: 9px;

    color: #4fa8b5;

    margin-top: 3px;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    display: grid;

    grid-template-columns:
        minmax(220px, 1fr)
        180px
        auto
        auto;

    gap: 8px;

    margin-bottom: 12px;

}


/* =========================================================
   INPUT
========================================================= */

.inp {

    width: 100%;

    background: #041a24;

    border:
        1px solid var(--line);

    color: #dffaff;

    padding: 10px 11px;

    border-radius: 6px;

    outline: none;

    font-size: 11px;

}


.inp:focus {

    border-color: #22d3ee;

    box-shadow:
        0 0 0 2px
        rgba(34,211,238,.06);

}


.inp::placeholder {

    color: #537b88;

}


.inp option {

    background: #06212d;

    color: #ffffff;

}


/* =========================================================
   BUTTON
========================================================= */

.btn {

    border:
        1px solid #1a92a3;

    background: #0b5361;

    color: white;

    border-radius: 6px;

    padding: 9px 13px;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    transition: .15s;

}


.btn:hover {

    background: #0e6676;

    transform:
        translateY(-1px);

}


.btn:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;

}


.btn-primary {

    background: #0891a3;

    border-color: #22d3ee;

}


.btn-danger {

    background:
        rgba(251,113,133,.08);

    border-color:
        rgba(251,113,133,.28);

    color: #fda4af;

}


/* =========================================================
   TABLE
========================================================= */

.tablewrap {

    overflow: auto;

}


.tbl {

    width: 100%;

    min-width: 850px;

    border-collapse:
        collapse;

}


.tbl th {

    padding: 11px;

    text-align: left;

    color: #4cc4cf;

    font-size: 9px;

    text-transform:
        uppercase;

    background: #062631;

    border-bottom:
        1px solid var(--line);

    white-space:
        nowrap;

}


.tbl td {

    padding: 11px;

    border-bottom:
        1px solid
        rgba(34,211,238,.08);

    font-size: 10px;

}


.tbl tbody tr:hover {

    background:
        rgba(34,211,238,.025);

}


/* =========================================================
   STATUS BADGE
========================================================= */

.badge {

    display: inline-flex;

    padding: 4px 8px;

    border-radius: 999px;

    font-size: 8px;

    font-weight: 800;

}


.active {

    background:
        rgba(45,212,191,.10);

    color: #5eead4;

    border:
        1px solid
        rgba(45,212,191,.15);

}


.inactive {

    background:
        rgba(148,163,184,.08);

    color: #94a3b8;

    border:
        1px solid
        rgba(148,163,184,.12);

}


/* =========================================================
   ACTION BUTTON
========================================================= */

.act {

    border:
        1px solid var(--line);

    background: #082a38;

    color: #67e8f9;

    border-radius: 5px;

    padding: 5px 8px;

    margin-right: 3px;

    cursor: pointer;

    font-size: 9px;

}


.act:hover {

    border-color: #22d3ee;

    background: #0a3545;

}


.act.red {

    color: #fda4af;

    border-color:
        rgba(251,113,133,.25);

}


.act.red:hover {

    background:
        rgba(251,113,133,.08);

}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,8,12,.82);

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 15px;

}


.modal.show {

    display: flex;

}


.modalbox {

    width: 100%;

    max-width: 500px;

    background: #041a24;

    border:
        1px solid #167b8b;

    border-radius: 10px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.5);

}


.modalhead {

    padding: 16px 18px;

    border-bottom:
        1px solid var(--line);

    display: flex;

    justify-content:
        space-between;

    align-items: center;

}


.modalbody {

    padding: 18px;

}


.modalfoot {

    padding: 14px 18px;

    border-top:
        1px solid var(--line);

    display: flex;

    justify-content:
        flex-end;

    gap: 7px;

}


/* =========================================================
   FORM LABEL
========================================================= */

.label {

    display: block;

    font-size: 10px;

    color: #86ddea;

    margin-bottom: 7px;

}


/* =========================================================
   STATUS SWITCH
========================================================= */

.switchrow {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-top: 15px;

    padding: 11px;

    border:
        1px solid
        rgba(34,211,238,.10);

    border-radius: 7px;

}


.switch {

    position: relative;

    width: 43px;

    height: 23px;

}


.switch input {

    opacity: 0;

    width: 0;

    height: 0;

}


.slider {

    position: absolute;

    inset: 0;

    background: #334155;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;

}


.slider::before {

    content: "";

    position: absolute;

    width: 17px;

    height: 17px;

    left: 3px;

    top: 3px;

    border-radius: 50%;

    background: white;

    transition: .2s;

}


.switch input:checked + .slider {

    background: #0d9488;

}


.switch input:checked + .slider::before {

    transform:
        translateX(20px);

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position: fixed;

    inset: 0;

    z-index: 2000;

    background:
        rgba(0,10,15,.76);

    display: none;

    align-items: center;

    justify-content: center;

}


.loading.show {

    display: flex;

}


.loadbox {

    padding: 18px 28px;

}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 3000;

    background: #05202b;

    border:
        1px solid #22d3ee;

    padding: 12px 16px;

    border-radius: 8px;

    display: none;

    font-size: 11px;

    max-width: 400px;

}


.toast.show {

    display: block;

}


.toast.error {

    border-color: #fb7185;

}


.toast.success {

    border-color: #2dd4bf;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    text-align: center;

    padding: 45px;

    color: #64748b;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px) {

    .stats {

        grid-template-columns:
            repeat(2,1fr);

    }


    .dash {

        grid-template-columns:
            1fr;

    }


    .rankgrid {

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:1023px) {

    .main {

        margin-left: 0;

        padding-bottom: 72px;

    }


    .content {

        padding: 13px;

    }

}


@media(max-width:700px) {

    .stats {

        grid-template-columns:
            1fr 1fr;

    }


    .toolbar {

        grid-template-columns:
            1fr 1fr;

    }


    .rankgrid {

        grid-template-columns:
            1fr 1fr;

    }


    .title {

        font-size: 21px;

    }


    .toolbar .wide {

        grid-column:
            1 / -1;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SHARED SIDEBAR
===================================================== -->

<div id="sharedSidebar"></div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

<div class="content">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="hud header">

    <div class="title">

<script>

/* =========================================================
   SUPABASE / GLOBAL VARIABLE
========================================================= */

const db = window.supabaseClient;


/* =========================================================
   DOM ELEMENT
========================================================= */

const searchInput =
    document.getElementById('searchInput');

const filterStatus =
    document.getElementById('filterStatus');

const kategoriForm =
    document.getElementById('kategoriForm');

const kategoriModal =
    document.getElementById('kategoriModal');

const kategoriBody =
    document.getElementById('kategoriBody');

const jumlahPaparan =
    document.getElementById('jumlahPaparan');

const rankingKategori =
    document.getElementById('rankingKategori');

const statJumlah =
    document.getElementById('statJumlah');

const statAktif =
    document.getElementById('statAktif');

const statTidakAktif =
    document.getElementById('statTidakAktif');

const statProduk =
    document.getElementById('statProduk');

const aktifPct =
    document.getElementById('aktifPct');

const aktifBar =
    document.getElementById('aktifBar');

const tidakPct =
    document.getElementById('tidakPct');

const tidakBar =
    document.getElementById('tidakBar');

const editId =
    document.


/* =========================================================
   DOM CONTENT LOADED
========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        /* =========================
           SEARCH
        ========================= */

        searchInput.addEventListener(
            'input',
            paparKategori
        );


        /* =========================
           FILTER STATUS
        ========================= */

        filterStatus.addEventListener(
            'change',
            paparKategori
        );


        /* =========================
           FORM
        ========================= */

        kategoriForm.addEventListener(
            'submit',
            simpanKategori
        );


        /* =========================
           TUTUP MODAL
           BILA KLIK BACKDROP
        ========================= */

        kategoriModal.addEventListener(
            'click',
            event => {

                if (
                    event.target ===
                    kategoriModal
                ) {

                    tutupModal();

                }

            }
        );


        /* =========================
           ESCAPE KEY
        ========================= */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Escape'
                ) {

                    tutupModal();

                }

            }
        );


        /* =========================
           SEMAK SUPABASE
        ========================= */

        if (!db) {

            showToast(
                'error',
                'Supabase tidak tersedia. Semak supabase-config.js'
            );

            return;

        }


        /* =========================
           MUAT DATA
        ========================= */

        await muatSemula();

    }
);


/* =========================================================
   MUAT SEMULA
========================================================= */

async function muatSemula() {

    setLoading(
        true,
        'Memuatkan kategori...'
    );


    try {

        /* =================================================
           AMBIL KATEGORI DAN PRODUK SERENTAK
        ================================================= */

        const [
            kategoriResult,
            produkResult
        ] = await Promise.all([


            /* =========================
               KATEGORI
            ========================= */

            db
                .from('kategori')
                .select(`
                    id,
                    nama,
                    status,
                    created_at
                `)
                .order(
                    'nama',
                    {
                        ascending: true
                    }
                ),


            /* =========================
               SPAREPART
            ========================= */

            db
                .from('sparepart')
                .select(`
                    id,
                    kategori_id
                `)
                .not(
                    'kategori_id',
                    'is',
                    null
                )

        ]);


        /* =================================================
           SEMAK ERROR KATEGORI
        ================================================= */

        if (
            kategoriResult.error
        ) {

            throw kategoriResult.error;

        }


        /* =================================================
           SEMAK ERROR SPAREPART
        ================================================= */

        if (
            produkResult.error
        ) {

            throw produkResult.error;

        }


        /* =================================================
           SIMPAN DATA
        ================================================= */

        kategori =
            kategoriResult.data || [];


        produkKategori =
            produkResult.data || [];


        /* =================================================
           RENDER
        ================================================= */

        renderDashboard();

        paparKategori();


    } catch (error) {

        console.error(
            'RALAT MUAT KATEGORI:',
            error
        );


        showToast(
            'error',
            'Gagal memuat kategori: ' +
            (
                error.message ||
                'Ralat tidak diketahui.'
            )
        );


    } finally {

        setLoading(false);

    }

}


/* =========================================================
   KIRA BILANGAN PRODUK DALAM KATEGORI
========================================================= */

function kiraProduk(
    kategoriId
) {

    return produkKategori.filter(
        item => {

            return (
                String(
                    item.kategori_id
                ) ===
                String(
                    kategoriId
                )
            );

        }
    ).length;

}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard() {

    /* =====================================================
       JUMLAH KATEGORI
    ===================================================== */

    const jumlah =
        kategori.length;


    /* =====================================================
       KATEGORI AKTIF
    ===================================================== */

    const aktif =
        kategori.filter(
            item =>
                item.status === true
        ).length;


    /* =====================================================
       KATEGORI TIDAK AKTIF
    ===================================================== */

    const tidakAktif =
        jumlah - aktif;


    /* =====================================================
       PERATUS AKTIF
    ===================================================== */

    const peratusAktif =
        jumlah > 0
            ? Math.round(
                (
                    aktif /
                    jumlah
                ) * 100
              )
            : 0;


    /* =====================================================
       PERATUS TIDAK AKTIF
    ===================================================== */

    const peratusTidakAktif =
        jumlah > 0
            ? Math.round(
                (
                    tidakAktif /
                    jumlah
                ) * 100
              )
            : 0;


    /* =====================================================
       STATISTIC CARD
    ===================================================== */

    statJumlah.textContent =
        formatNumber(
            jumlah
        );


    statAktif.textContent =
        formatNumber(
            aktif
        );


    statTidakAktif.textContent =
        formatNumber(
            tidakAktif
        );


    /*
        Ini ialah jumlah sparepart
        yang mempunyai kategori_id.
    */

    statProduk.textContent =
        formatNumber(
            produkKategori.length
        );


    /* =====================================================
       STATUS PERCENTAGE
    ===================================================== */

    aktifPct.textContent =
        `${peratusAktif}%`;


    aktifBar.style.width =
        `${peratusAktif}%`;


    tidakPct.textContent =
        `${peratusTidakAktif}%`;


    tidakBar.style.width =
        `${peratusTidakAktif}%`;


    /* =====================================================
       RANKING PENGGUNAAN KATEGORI
    ===================================================== */

    const ranking =
        kategori
            .map(
                item => {

                    return {

                        ...item,

                        jumlah_produk:
                            kiraProduk(
                                item.id
                            )

                    };

                }
            )
            .sort(
                (a, b) => {

                    /*
                        Susun jumlah produk
                        paling banyak dahulu.
                    */

                    if (
                        b.jumlah_produk !==
                        a.jumlah_produk
                    ) {

                        return (
                            b.jumlah_produk -
                            a.jumlah_produk
                        );

                    }


                    /*
                        Jika sama,
                        susun nama A-Z.
                    */

                    return String(
                        a.nama || ''
                    ).localeCompare(
                        String(
                            b.nama || ''
                        ),
                        'ms'
                    );

                }
            )
            .slice(
                0,
                8
            );


    /* =====================================================
       PAPAR RANKING
    ===================================================== */

    if (
        !ranking.length
    ) {

        rankingKategori.innerHTML = `

            <div class="mini">

                Belum ada kategori.

            </div>

        `;

        return;

    }


    rankingKategori.innerHTML =
        ranking
            .map(
                (
                    item,
                    index
                ) => {

                    return `

                        <div class="rank">

                            <div class="rankline">

                                <span>

                                    ${String(
                                        index + 1
                                    ).padStart(
                                        2,
                                        '0'
                                    )}

                                    ${escapeHtml(
                                        item.nama
                                    )}

                                </span>


                                <b>

                                    ${formatNumber(
                                        item.jumlah_produk
                                    )}

                                </b>

                            </div>


                            <div class="mini">

                                produk digunakan

                            </div>

                        </div>

                    `;

                }
            )
            .join('');

}


/* =========================================================
   PAPAR SENARAI KATEGORI
========================================================= */

function paparKategori() {

    /* =====================================================
       SEARCH
    ===================================================== */

    const search =
        String(
            searchInput.value || ''
        )
        .trim()
        .toLowerCase();


    /* =====================================================
       STATUS FILTER
    ===================================================== */

    const statusFilter =
        filterStatus.value;


    /* =====================================================
       FILTER DATA
    ===================================================== */

    const senarai =
        kategori.filter(
            item => {

                /* =========================
                   SEARCH NAMA
                ========================= */

                if (
                    search &&
                    !String(
                        item.nama || ''
                    )
                    .toLowerCase()
                    .includes(
                        search
                    )
                ) {

                    return false;

                }


                /* =========================
                   STATUS
                ========================= */

                if (
                    statusFilter !== '' &&
                    String(
                        Boolean(
                            item.status
                        )
                    ) !==
                    statusFilter
                ) {

                    return false;

                }


                return true;

            }
        );


    /* =====================================================
       JUMLAH DIPAPARKAN
    ===================================================== */

    jumlahPaparan.textContent =
        `${senarai.length} kategori`;


    /* =====================================================
       KOSONGKAN TABLE
    ===================================================== */

    kategoriBody.innerHTML = '';


    /* =====================================================
       TIADA DATA
    ===================================================== */

    if (
        !senarai.length
    ) {

        kategoriBody.innerHTML = `

            <tr>

                <td colspan="6">

                    <div class="empty">

                        Tiada kategori dijumpai.

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    /* =====================================================
       PAPAR ROW
    ===================================================== */

    senarai.forEach(
        (
            item,
            index
        ) => {

            /* =========================
               JUMLAH PRODUK
            ========================= */

            const jumlahProduk =
                kiraProduk(
                    item.id
                );


            /* =========================
               STATUS
            ========================= */

            const statusHtml =
                item.status
                    ? `

                        <span
                            class="
                                badge
                                active
                            "
                        >

                            AKTIF

                        </span>

                      `
                    : `

                        <span
                            class="
                                badge
                                inactive
                            "
                        >

                            TIDAK AKTIF

                        </span>

                      `;


            /* =========================
               LABEL BUTTON STATUS
            ========================= */

            const statusButton =
                item.status
                    ? 'Nyahaktif'
                    : 'Aktifkan';


            /* =========================
               CREATE ROW
            ========================= */

            const tr =
                document.createElement(
                    'tr'
                );


            tr.innerHTML = `

                <td>

                    ${index + 1}

                </td>


                <td>

                    <div
                        class="
                            font-bold
                            text-cyan-200
                        "
                    >

                        ${escapeHtml(
                            item.nama
                        )}

                    </div>


                    <div class="mini">

                        ID:
                        ${Number(
                            item.id
                        )}

                    </div>

                </td>


                <td>

                    <b>

                        ${formatNumber(
                            jumlahProduk
                        )}

                    </b>

                    <span class="mini">

                        produk

                    </span>

                </td>


                <td>

                    ${statusHtml}

                </td>


                <td>

                    ${formatDate(
                        item.created_at
                    )}

                </td>


                <td>

                    <!-- EDIT -->

                    <button
                        type="button"
                        class="act"
                        onclick="
                            bukaEdit(
                                ${Number(item.id)}
                            )
                        "
                    >

                        Edit

                    </button>


                    <!-- STATUS -->

                    <button
                        type="button"
                        class="act"
                        onclick="
                            tukarStatus(
                                ${Number(item.id)}
                            )
                        "
                    >

                        ${statusButton}

                    </button>


                    <!-- DELETE -->

                    <button
                        type="button"
                        class="act red"
                        onclick="
                            padamKategori(
                                ${Number(item.id)}
                            )
                        "
                    >

                        Padam

                    </button>

                </td>

            `;


            kategoriBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   BUKA MODAL TAMBAH
========================================================= */

function bukaTambah() {

    /* =========================
       RESET FORM
    ========================= */

    kategoriForm.reset();


    /* =========================
       TIADA ID = INSERT
    ========================= */

    editId.value = '';


    /* =========================
       DEFAULT AKTIF
    ========================= */

    statusKategori.checked =
        true;


    /* =========================
       MODAL TITLE
    ========================= */

    modalTitle.textContent =
        'Tambah Kategori';


    modalSub.textContent =
        'Masukkan kategori produk baharu.';


    /* =========================
       BUKA
    ========================= */

    kategoriModal
        .classList
        .add(
            'show'
        );


    /* =========================
       FOCUS
    ========================= */

    setTimeout(
        () => {

            namaKategori.focus();

        },
        80
    );

}


/* =========================================================
   BUKA MODAL EDIT
========================================================= */

function bukaEdit(id) {

    /* =====================================================
       CARI KATEGORI
    ===================================================== */

    const item =
        kategori.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            'error',
            'Kategori tidak dijumpai.'
        );

        return;

    }


    /* =====================================================
       SET VALUE
    ===================================================== */

    editId.value =
        item.id;


    namaKategori.value =
        item.nama || '';


    statusKategori.checked =
        Boolean(
            item.status
        );


    /* =====================================================
       MODAL TITLE
    ===================================================== */

    modalTitle.textContent =
        'Edit Kategori';


    modalSub.textContent =
        'Kemaskini maklumat kategori.';


    /* =====================================================
       BUKA MODAL
    ===================================================== */

    kategoriModal
        .classList
        .add(
            'show'
        );


    /* =====================================================
       FOCUS
    ===================================================== */

    setTimeout(
        () => {

            namaKategori.focus();

            namaKategori.select();

        },
        80
    );

}


/* =========================================================
   TUTUP MODAL
========================================================= */

function tutupModal() {

    kategoriModal
        .classList
        .remove(
            'show'
        );

}


/* =========================================================
   SIMPAN KATEGORI
========================================================= */

async function simpanKategori(
    event
) {

    event.preventDefault();


    /* =====================================================
       NILAI FORM
    ===================================================== */

    const id =
        String(
            editId.value || ''
        ).trim();


    const nama =
        String(
            namaKategori.value || ''
        ).trim();


    const status =
        Boolean(
            statusKategori.checked
        );


    /* =====================================================
       VALIDATION NAMA
    ===================================================== */

    if (!nama) {

        showToast(
            'error',
            'Nama kategori wajib diisi.'
        );


        namaKategori.focus();

        return;

    }


    /* =====================================================
       DISABLE BUTTON
    ===================================================== */

    btnSimpan.disabled =
        true;


    setLoading(
        true,
        id
            ? 'Mengemaskini kategori...'
            : 'Menyimpan kategori...'
    );


    try {

        /* =================================================
           SEMAK DUPLICATE NAMA
        ================================================= */

        let duplicateQuery =
            db
                .from('kategori')
                .select(`
                    id,
                    nama
                `)
                .ilike(
                    'nama',
                    nama
                )
                .limit(
                    1
                );


        /* =================================================
           EDIT:
           JANGAN SEMAK DIRI SENDIRI
        ================================================= */

        if (id) {

            duplicateQuery =
                duplicateQuery.neq(
                    'id',
                    Number(id)
                );

        }


        const {
            data: duplicate,
            error: duplicateError
        } = await duplicateQuery;


        if (
            duplicateError
        ) {

            throw duplicateError;

        }


        /* =================================================
           DUPLICATE
        ================================================= */

        if (
            duplicate &&
            duplicate.length > 0
        ) {

            throw new Error(
                'Nama kategori tersebut telah wujud.'
            );

        }


        /* =================================================
           EDIT KATEGORI
        ================================================= */

        if (id) {

            const {
                error
            } = await db
                .from('kategori')
                .update({

                    nama:
                        nama,

                    status:
                        status

                })
                .eq(
                    'id',
                    Number(id)
                );


            if (error) {

                throw error;

            }


            showToast(
                'success',
                'Kategori berjaya dikemaskini.'
            );


        } else {


            /* =================================================
               TAMBAH KATEGORI
            ================================================= */

            const {
                error
            } = await db
                .from('kategori')
                .insert({

                    nama:
                        nama,

                    status:
                        status

                });


            if (error) {

                throw error;

            }


            showToast(
                'success',
                'Kategori berjaya ditambah.'
            );

        }


        /* =================================================
           TUTUP MODAL
        ================================================= */

        tutupModal();


        /* =================================================
           REFRESH
        ================================================= */

        await muatSemula();


    } catch (error) {

        console.error(
            'RALAT SIMPAN KATEGORI:',
            error
        );


        let message =
            error.message ||
            'Ralat tidak diketahui.';


        /* =================================================
           POSTGRES UNIQUE ERROR
        ================================================= */

        if (
            error.code === '23505'
        ) {

            message =
                'Nama kategori tersebut telah wujud.';

        }


        showToast(
            'error',
            'Gagal menyimpan kategori: ' +
            message
        );


    } finally {

        btnSimpan.disabled =
            false;


        setLoading(false);

    }

}

</script>

<script>

/* =========================================================
   TUKAR STATUS KATEGORI
========================================================= */

async function tukarStatus(id) {

    /* =====================================================
       CARI KATEGORI
    ===================================================== */

    const item =
        kategori.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            'error',
            'Kategori tidak dijumpai.'
        );

        return;

    }


    /* =====================================================
       STATUS BARU
    ===================================================== */

    const statusBaharu =
        !Boolean(
            item.status
        );


    /* =====================================================
       TEKS CONFIRM
    ===================================================== */

    const tindakan =
        statusBaharu
            ? 'Aktifkan'
            : 'Nyahaktifkan';


    const confirmStatus =
        confirm(

            `${tindakan} kategori?\n\n` +

            `${item.nama}`

        );


    if (!confirmStatus) {

        return;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    setLoading(
        true,
        'Mengemaskini status...'
    );


    try {

        /* =================================================
           UPDATE STATUS
        ================================================= */

        const {
            error
        } = await db
            .from('kategori')
            .update({

                status:
                    statusBaharu

            })
            .eq(
                'id',
                Number(id)
            );


        if (error) {

            throw error;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        showToast(

            'success',

            statusBaharu
                ? 'Kategori berjaya diaktifkan.'
                : 'Kategori berjaya dinyahaktifkan.'

        );


        /* =================================================
           REFRESH
        ================================================= */

        await muatSemula();


    } catch (error) {

        console.error(
            'RALAT STATUS KATEGORI:',
            error
        );


        showToast(
            'error',
            'Gagal mengemaskini status: ' +
            (
                error.message ||
                'Ralat tidak diketahui.'
            )
        );


    } finally {

        setLoading(false);

    }

}


/* =========================================================
   PADAM KATEGORI
========================================================= */

async function padamKategori(id) {

    /* =====================================================
       CARI KATEGORI
    ===================================================== */

    const item =
        kategori.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    if (!item) {

        showToast(
            'error',
            'Kategori tidak dijumpai.'
        );

        return;

    }


    /* =====================================================
       KIRA PRODUK MENGGUNAKAN KATEGORI
    ===================================================== */

    const digunakan =
        kiraProduk(
            id
        );


    /* =====================================================
       JANGAN PADAM JIKA DIGUNAKAN
    ===================================================== */

    if (
        digunakan > 0
    ) {

        showToast(

            'error',

            `Kategori "${item.nama}" digunakan oleh ` +
            `${digunakan} produk. ` +
            `Nyahaktifkan kategori jika tidak mahu ` +
            `kategori ini digunakan lagi.`

        );


        return;

    }


    /* =====================================================
       CONFIRM DELETE
    ===================================================== */

    const confirmDelete =
        confirm(

            `Padam kategori?\n\n` +

            `${item.nama}\n\n` +

            `Tindakan ini tidak boleh dibatalkan.`

        );


    if (!confirmDelete) {

        return;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    setLoading(
        true,
        'Memadam kategori...'
    );


    try {

        /* =================================================
           DELETE
        ================================================= */

        const {
            error
        } = await db
            .from('kategori')
            .delete()
            .eq(
                'id',
                Number(id)
            );


        if (error) {

            throw error;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        showToast(
            'success',
            'Kategori berjaya dipadam.'
        );


        /* =================================================
           REFRESH
        ================================================= */

        await muatSemula();


    } catch (error) {

        console.error(
            'RALAT PADAM KATEGORI:',
            error
        );


        /* =================================================
           FOREIGN KEY
        ================================================= */

        let message =
            error.message ||
            'Ralat tidak diketahui.';


        if (
            error.code === '23503'
        ) {

            message =
                'Kategori masih digunakan oleh produk dan tidak boleh dipadam.';

        }


        showToast(
            'error',
            'Gagal memadam kategori: ' +
            message
        );


    } finally {

        setLoading(false);

    }

}


/* =========================================================
   FORMAT TARIKH
========================================================= */

function formatDate(value) {

    if (!value) {

        return '-';

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '-';

    }


    return date.toLocaleDateString(
        'ms-MY',
        {

            day:
                '2-digit',

            month:
                '2-digit',

            year:
                'numeric'

        }
    );

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value) {

    return Number(
        value || 0
    ).toLocaleString(
        'ms-MY',
        {

            minimumFractionDigits:
                0,

            maximumFractionDigits:
                2

        }
    );

}


/* =========================================================
   ESCAPE HTML

   Elakkan nilai database dimasukkan terus
   sebagai HTML.
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ''
    )

    .replace(
        /&/g,
        '&amp;'
    )

    .replace(
        /</g,
        '&lt;'
    )

    .replace(
        />/g,
        '&gt;'
    )

    .replace(
        /"/g,
        '&quot;'
    )

    .replace(
        /'/g,
        '&#039;'
    );

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    show,
    text = 'Memproses...'
) {

    if (loadingTextElement) {

        loadingTextElement.textContent =
            text;

    }

    if (loadingOverlay) {

        loadingOverlay.classList.toggle(
            'show',
            Boolean(show)
        );

    }

}

/* =========================================================
   TOAST
========================================================= */

function showToast(
    type,
    message
) {

    const element =
        document.getElementById(
            'toast'
        );


    if (!element) {

        return;

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    element.textContent =
        message || '';


    /* =====================================================
       CLASS
    ===================================================== */

    element.className =
        `toast show ${type || ''}`;


    /* =====================================================
       RESET TIMER
    ===================================================== */

    clearTimeout(
        toastTimer
    );


    /* =====================================================
       AUTO HIDE
    ===================================================== */

    toastTimer =
        setTimeout(
            () => {

                element
                    .classList
                    .remove(
                        'show'
                    );

            },
            4500
        );

}

</script>
