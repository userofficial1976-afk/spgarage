<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POS / Cashier - Inventori & POS</title>
<link rel="icon" type="image/png" href="logomdp.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#03141d;--panel:#06212d;--panel2:#082a38;--line:rgba(34,211,238,.24);--cyan:#22d3ee;--teal:#2dd4bf;--txt:#e6fbff;--muted:#70a4b1;--red:#fb7185;--amber:#fbbf24}*{box-sizing:border-box;font-family:"Century Gothic",CenturyGothic,AppleGothic,sans-serif}body{margin:0;background:radial-gradient(circle at 50% 5%,#073344 0,#03141d 44%,#020e15 100%);color:var(--txt)}.main{margin-left:288px;min-height:100vh}.pos{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 410px;overflow:hidden}.catalog{min-width:0;display:flex;flex-direction:column}.hud{background:linear-gradient(180deg,rgba(8,42,56,.92),rgba(3,25,35,.92));border:1px solid var(--line)}.top{padding:17px 20px;border-bottom:1px solid var(--line);background:rgba(3,25,35,.92)}.title{font-size:20px;font-weight:900;text-shadow:0 0 12px rgba(34,211,238,.24)}.sub{font-size:10px;color:#59b9c8}.search{width:100%;background:#041a24;border:1px solid var(--line);border-radius:7px;color:#dffaff;padding:11px 13px;outline:none;font-size:12px}.search:focus{border-color:#22d3ee;box-shadow:0 0 0 2px rgba(34,211,238,.06)}.cats{display:flex;gap:7px;overflow:auto;padding:11px 20px;border-bottom:1px solid var(--line);background:rgba(4,26,36,.72)}.cat{border:1px solid var(--line);background:#062631;color:#8edce7;padding:7px 13px;border-radius:999px;font-size:10px;white-space:nowrap;cursor:pointer}.cat.active{background:#0891a3;border-color:#22d3ee;color:#fff;box-shadow:0 0 10px rgba(34,211,238,.13)}.products{padding:15px 20px;overflow:auto;flex:1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.product{min-height:145px;border:1px solid rgba(34,211,238,.15);background:linear-gradient(180deg,#082a38,#051d28);border-radius:9px;padding:11px;text-align:left;color:#e6fbff;cursor:pointer;transition:.16s;display:flex;flex-direction:column}.product:hover{transform:translateY(-2px);border-color:#22d3ee;box-shadow:0 0 16px rgba(34,211,238,.08)}.pic{height:62px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}.pic img{width:74px;height:62px;object-fit:contain;border-radius:7px}.noimg{font-size:28px;color:#3d6e79}.pname{font-size:11px;font-weight:800;line-height:1.3}.pcode{font-size:9px;color:#4fa8b5;margin-top:2px}.prow{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:6px}.price{font-size:13px;font-weight:900;color:#67e8f9}.stock{font-size:9px;color:#78b8c3}.stock.low{color:#fbbf24}.scan{border:1px dashed #22d3ee;align-items:center;justify-content:center;color:#67e8f9}.cart{background:linear-gradient(180deg,#06212d,#031923);color:#e6fbff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.carthead{height:78px;padding:15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.clear{border:1px solid rgba(251,113,133,.25);background:rgba(251,113,133,.08);color:#fda4af;border-radius:6px;padding:7px 10px;font-size:10px;cursor:pointer}.items{flex:1;overflow:auto;padding:7px 13px}.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(34,211,238,.09)}.thumb{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#4fa8b5}.thumb img{max-width:42px;max-height:42px;object-fit:contain}.iname{font-size:10px;font-weight:800}.icode{font-size:8px;color:#5895a1}.qty{display:flex;align-items:center;gap:3px}.qty button{width:25px;height:25px;border:1px solid var(--line);border-radius:5px;background:#082a38;color:#b9f6ff;cursor:pointer}.iq{width:22px;text-align:center;font-size:11px;font-weight:bold}.itotal{font-size:10px;font-weight:bold;width:63px;text-align:right;color:#67e8f9}.del{border:0;background:transparent;color:#fda4af;cursor:pointer;font-size:9px}.summary{padding:13px;border-top:1px solid var(--line);background:#041a24}.paytypes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 11px}.paytype{padding:8px 3px;border:1px solid var(--line);background:#062631;color:#8edce7;border-radius:6px;font-size:9px;cursor:pointer}.paytype.active{border-color:#22d3ee;background:#0b5361;color:#fff;font-weight:bold}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.label{font-size:9px;color:#72b8c4}.field{width:100%;margin-top:4px;border:1px solid var(--line);background:#031923;color:#e6fbff;padding:8px;border-radius:6px;outline:none}.balance{color:#5eead4;background:rgba(45,212,191,.06)}.sumrow{display:flex;justify-content:space-between;font-size:10px;margin:7px 0}.total{font-size:17px;font-weight:900;border-top:1px solid var(--line);padding-top:10px;margin-top:9px;color:#b9f6ff}.pay{width:100%;border:1px solid #22d3ee;border-radius:7px;background:linear-gradient(135deg,#0891a3,#0f766e);color:#fff;font-weight:900;padding:12px;cursor:pointer;margin-top:10px}.pay:disabled{opacity:.35;cursor:not-allowed}.empty{text-align:center;color:#5f929e;padding:50px 10px;font-size:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:3000;background:#05202b;color:#fff;border:1px solid #22d3ee;padding:12px 15px;border-radius:8px;display:none;max-width:390px}.toast.show{display:block}.toast.error{border-color:#fb7185}.toast.success{border-color:#2dd4bf}.loading{position:fixed;inset:0;background:rgba(0,10,15,.78);z-index:2500;display:none;align-items:center;justify-content:center;color:#fff}.loading.show{display:flex}.box{background:#06212d;border:1px solid var(--line);padding:20px 28px;border-radius:9px}.mobileCart{display:none}@media(max-width:1350px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pos{grid-template-columns:minmax(0,1fr) 370px}}@media(max-width:1023px){.main{margin-left:0;padding-bottom:67px}.pos{height:calc(100vh - 67px);grid-template-columns:minmax(0,1fr) 345px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.pos{display:block;height:auto}.catalog{min-height:100vh}.cart{display:none}.products{overflow:visible}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:90px}.mobileCart{display:flex;position:fixed;left:12px;right:12px;bottom:76px;z-index:100;background:#06212d;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;box-shadow:0 10px 35px rgba(0,0,0,.35);align-items:center;justify-content:space-between}.top{padding:13px}.cats,.products{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div id="sharedSidebar"></div>
<main class="main"><div class="pos">
<section class="catalog">
<div class="top"><div class="flex items-center justify-between gap-4 mb-3"><div><div class="sub uppercase tracking-widest font-bold">POS / CASHIER</div><div class="title">JUALAN SPAREPART</div></div><div class="text-right"><div id="topUser" class="text-xs font-bold">Pengguna</div><div id="topRole" class="sub">-</div></div></div><input id="searchInput" class="search" placeholder="Cari nama, kod sparepart, no. part atau scan barcode..." autocomplete="off"></div>
<div id="kategoriBar" class="cats"><button class="cat active" data-id="">Semua Item</button></div><div class="products"><div id="produkGrid" class="grid"></div></div>
</section>
<aside class="cart"><div class="carthead"><div><b class="text-sm">PESANAN SEMASA</b><div id="orderNumber" class="sub mt-1">Order: Baharu</div></div><button class="clear" onclick="kosongkanTroli()">Kosongkan</button></div><div id="cartItems" class="items"></div><div class="summary"><div class="text-[9px] font-bold text-cyan-300">KAEDAH BAYARAN</div><div id="payTypes" class="paytypes"><button class="paytype active" data-pay="TUNAI">Tunai</button><button class="paytype" data-pay="KAD">Kad</button><button class="paytype" data-pay="DUITNOW">QR / DuitNow</button><button class="paytype" data-pay="ONLINE_BANKING">Online</button></div><div id="cashFields" class="formrow"><label class="label">Tunai Diterima<input id="bayaranInput" type="number" min="0" step="0.01" class="field" placeholder="0.00"></label><div class="label">Baki<div id="bakiDisplay" class="field balance">RM 0.00</div></div></div><div class="sumrow"><span>Sub Total</span><b id="subtotalDisplay">RM 0.00</b></div><div class="sumrow"><span>Diskaun</span><span>RM 0.00</span></div><div class="sumrow"><span>Cukai</span><span>RM 0.00</span></div><div class="sumrow total"><span>JUMLAH</span><span id="totalDisplay">RM 0.00</span></div><button id="btnBayar" class="pay" onclick="bayarSekarang()" disabled>BAYAR SEKARANG</button></div></aside>
</div></main>
<div id="sharedMobileNav"></div><div id="mobileCart" class="mobileCart"><div><div id="mobileCount" class="sub">0 item</div><b id="mobileTotal">RM 0.00</b></div><button class="pay !w-auto !mt-0 !px-5">Troli</button></div><div id="loading" class="loading"><div id="loadingText" class="box">Memproses...</div></div><div id="toast" class="toast"><b id="toastTitle"></b><div id="toastMsg" class="text-[10px] mt-1 text-slate-300"></div></div>
<script>
const db=window.supabaseClient,STORAGE_BUCKET='produk';let produk=[],troli=[],kategoriAktif='',kaedah='TUNAI',toastTimer=null;function el(id){return document.getElementById(id)}
document.addEventListener('DOMContentLoaded',async()=>{paparPengguna();pasangEvent();if(!db)return showToast('error','Supabase tidak tersedia','Semak supabase-config.js');await init();paparTroli()});
function pasangEvent(){el('searchInput').addEventListener('input',paparProduk);el('searchInput').addEventListener('keydown',barcodeEnter);el('bayaranInput').addEventListener('input',paparTroli);el('payTypes').addEventListener('click',e=>{const b=e.target.closest('[data-pay]');if(!b)return;kaedah=b.dataset.pay;document.querySelectorAll('.paytype').forEach(x=>x.classList.toggle('active',x===b));el('cashFields').style.display=kaedah==='TUNAI'?'grid':'none';paparTroli()});document.addEventListener('keydown',shortcut)}
async function init(){setLoading(true,'Memuatkan produk...');try{await Promise.all([muatProduk(),muatKategori()])}catch(e){console.error('RALAT INIT POS:',e);showToast('error','Gagal memuatkan POS',e.message)}finally{setLoading(false)}}
async function muatProduk(){const r=await db.from('sparepart').select('id,kod_sparepart,nama,no_part,kategori_id,unit,stok_semasa,stok_minimum,harga_jual,image_path,status').eq('status',true).order('nama');if(r.error)throw r.error;produk=r.data||[];paparProduk()}
async function muatKategori(){const r=await db.from('kategori').select('id,nama,status').eq('status',true).order('nama');if(r.error)throw r.error;el('kategoriBar').innerHTML='<button class="cat active" data-id="">Semua Item</button>';(r.data||[]).forEach(k=>{const b=document.createElement('button');b.className='cat';b.dataset.id=k.id;b.textContent=k.nama;el('kategoriBar').appendChild(b)});el('kategoriBar').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;kategoriAktif=b.dataset.id||'';document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));paparProduk()}}
function paparProduk(){const q=(el('searchInput').value||'').trim().toLowerCase(),list=produk.filter(x=>(!kategoriAktif||String(x.kategori_id)===String(kategoriAktif))&&(!q||[x.nama,x.kod_sparepart,x.no_part].filter(Boolean).join(' ').toLowerCase().includes(q)));const g=el('produkGrid');g.innerHTML='<button class="product scan" onclick="document.getElementById(\'searchInput\').focus()"><div class="text-3xl">▥</div><b class="text-xs mt-2">SCAN BARCODE</b><span class="sub mt-1">Kod produk / no. part</span></button>';list.forEach(x=>{const stok=Number(x.stok_semasa||0),min=Number(x.stok_minimum||0),url=gambarUrl(x.image_path),c=document.createElement('button');c.className='product';c.innerHTML='<div class="pic">'+(url?'<img src="'+esc(url)+'">':'<span class="noimg">▣</span>')+'</div><div class="pname">'+esc(x.nama)+'</div><div class="pcode">#'+esc(x.kod_sparepart)+(x.no_part?' · '+esc(x.no_part):'')+'</div><div class="prow"><span class="price">RM '+rm(x.harga_jual)+'</span><span class="stock '+(stok<=0||min>0&&stok<=min?'low':'')+'">'+(stok<=0?'STOK KOSONG':'Stok '+num(stok)+' '+esc(x.unit||'PCS'))+'</span></div>';if(stok<=0)c.style.opacity='.48';c.onclick=()=>tambahTroli(x.id);g.appendChild(c)})}
function tambahTroli(id){const p=produk.find(x=>Number(x.id)===Number(id));if(!p)return;const stok=Number(p.stok_semasa||0);if(stok<=0)return showToast('error','Stok kosong',p.nama);const x=troli.find(v=>v.id===p.id);if(x){if(x.kuantiti+1>stok)return showToast('error','Stok tidak mencukupi','Baki '+num(stok)+' '+(p.unit||'PCS'));x.kuantiti++}else troli.push({id:p.id,kod_sparepart:p.kod_sparepart,nama:p.nama,harga:Number(p.harga_jual||0),kuantiti:1,stok,image_path:p.image_path,unit:p.unit||'PCS'});paparTroli()}
function ubahQty(id,d){const x=troli.find(v=>v.id===id);if(!x)return;const n=x.kuantiti+d;if(n<=0)return buangItem(id);if(n>x.stok)return showToast('error','Stok tidak mencukupi','Baki '+num(x.stok)+' '+x.unit);x.kuantiti=n;paparTroli()}function buangItem(id){troli=troli.filter(x=>x.id!==id);paparTroli()}function kosongkanTroli(){if(troli.length&&confirm('Kosongkan semua item dalam troli?')){troli=[];el('bayaranInput').value='';paparTroli()}}
function paparTroli(){const box=el('cartItems');box.innerHTML='';if(!troli.length)box.innerHTML='<div class="empty"><div class="text-3xl mb-2">▣</div><b>Troli masih kosong</b><div>Pilih produk untuk memulakan jualan.</div></div>';troli.forEach(x=>{const url=gambarUrl(x.image_path),d=document.createElement('div');d.className='item';d.innerHTML='<div class="thumb">'+(url?'<img src="'+esc(url)+'">':'▣')+'</div><div><div class="iname">'+esc(x.nama)+'</div><div class="icode">'+esc(x.kod_sparepart)+' · RM '+rm(x.harga)+'</div></div><div class="qty"><button onclick="ubahQty('+x.id+',-1)">−</button><span class="iq">'+num(x.kuantiti)+'</span><button onclick="ubahQty('+x.id+',1)">+</button></div><div><div class="itotal">RM '+rm(x.harga*x.kuantiti)+'</div><button class="del" onclick="buangItem('+x.id+')">Padam</button></div>';box.appendChild(d)});const total=kiraTotal(),count=troli.reduce((s,x)=>s+Number(x.kuantiti),0);el('subtotalDisplay').textContent='RM '+rm(total);el('totalDisplay').textContent='RM '+rm(total);el('mobileTotal').textContent='RM '+rm(total);el('mobileCount').textContent=num(count)+' item';const bayar=kaedah==='TUNAI'?Number(el('bayaranInput').value||0):total;el('bakiDisplay').textContent='RM '+rm(Math.max(0,bayar-total));el('btnBayar').disabled=!troli.length||(kaedah==='TUNAI'&&bayar<total)}function kiraTotal(){return troli.reduce((s,x)=>s+Number(x.harga)*Number(x.kuantiti),0)}
async function bayarSekarang(){if(!troli.length)return;const subtotal=kiraTotal(),jumlah=subtotal,bayaran=kaedah==='TUNAI'?Number(el('bayaranInput').value||0):jumlah,baki=Math.max(0,bayaran-jumlah);if(kaedah==='TUNAI'&&bayaran<jumlah)return showToast('error','Bayaran tidak mencukupi','Jumlah perlu dibayar RM '+rm(jumlah));setLoading(true,'Memproses jualan...');let jualanId=null;try{const ids=troli.map(x=>x.id),pr=await db.from('sparepart').select('id,kod_sparepart,nama,unit,stok_semasa,harga_jual,status').in('id',ids);if(pr.error)throw pr.error;const live=pr.data||[];for(const item of troli){const p=live.find(x=>Number(x.id)===Number(item.id));if(!p||p.status===false||Number(p.stok_semasa)<item.kuantiti)throw new Error('Stok '+item.nama+' tidak mencukupi atau produk tidak aktif.')}const no=janaNoJualan(),jr=await db.from('jualan').insert({no_jualan:no,subtotal,diskaun:0,cukai:0,jumlah,bayaran,baki,kaedah_bayaran:kaedah,status:'PAID'}).select('id,no_jualan').single();if(jr.error)throw jr.error;jualanId=jr.data.id;const rows=troli.map(x=>({jualan_id:jualanId,sparepart_id:x.id,kod_sparepart:x.kod_sparepart,nama_sparepart:x.nama,kuantiti:x.kuantiti,harga_seunit:x.harga,diskaun:0,jumlah:x.harga*x.kuantiti})),dr=await db.from('jualan_detail').insert(rows);if(dr.error)throw dr.error;for(const item of troli){const p=live.find(x=>Number(x.id)===Number(item.id)),before=Number(p.stok_semasa),after=before-item.kuantiti;const ur=await db.from('sparepart').update({stok_semasa:after,updated_at:new Date().toISOString()}).eq('id',item.id).eq('stok_semasa',before).select('id');if(ur.error)throw ur.error;if(!ur.data?.length)throw new Error('Stok '+item.nama+' telah berubah. Sila cuba semula.');const sr=await db.from('stok_pergerakan').insert({sparepart_id:item.id,jenis:'JUALAN',kuantiti:item.kuantiti,stok_sebelum:before,stok_selepas:after,rujukan:no,jualan_id:jualanId,catatan:'Jualan melalui POS'});if(sr.error)throw sr.error}el('orderNumber').textContent='Order: '+no;showToast('success','Bayaran berjaya',no+' · RM '+rm(jumlah));troli=[];el('bayaranInput').value='';await muatProduk();paparTroli()}catch(e){console.error('RALAT TRANSAKSI POS:',e);showToast('error','Transaksi gagal',e.message||'Ralat tidak diketahui.');if(jualanId)console.warn('Jualan telah diwujudkan sebelum proses berikutnya gagal. ID:',jualanId)}finally{setLoading(false)}}
function barcodeEnter(e){if(e.key!=='Enter')return;e.preventDefault();const v=(el('searchInput').value||'').trim().toLowerCase();if(!v)return;const x=produk.find(p=>String(p.kod_sparepart||'').toLowerCase()===v||String(p.no_part||'').toLowerCase()===v);if(!x)return showToast('error','Produk tidak dijumpai','Tiada produk untuk kod '+v);tambahTroli(x.id);el('searchInput').value='';paparProduk()}function shortcut(e){if(e.key==='F2'){e.preventDefault();el('searchInput').focus();el('searchInput').select()}if(e.key==='F4'){e.preventDefault();if(!el('btnBayar').disabled)bayarSekarang()}if(e.key==='Escape'){el('searchInput').value='';kategoriAktif='';document.querySelectorAll('.cat').forEach((b,i)=>b.classList.toggle('active',i===0));paparProduk()}}
function janaNoJualan(){const d=new Date(),p=n=>String(n).padStart(2,'0');return 'J'+String(d.getFullYear()).slice(-2)+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+String(Math.floor(Math.random()*100)).padStart(2,'0')}function gambarUrl(path){if(!path)return'';if(/^https?:\/\//i.test(path))return path;return db.storage.from(STORAGE_BUCKET).getPublicUrl(path).data?.publicUrl||''}function rm(v){return Number(v||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}function num(v){return Number(v||0).toLocaleString('ms-MY',{maximumFractionDigits:2})}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function setLoading(show,text){el('loadingText').textContent=text||'Memproses...';el('loading').classList.toggle('show',Boolean(show))}function showToast(type,title,msg){el('toast').className='toast show '+type;el('toastTitle').textContent=title||'';el('toastMsg').textContent=msg||'';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),4500)}function paparPengguna(){try{const u=window.currentUser||JSON.parse(localStorage.getItem('mdp_user')||'null')||JSON.parse(localStorage.getItem('pengguna')||'null');if(u){el('topUser').textContent=u.name||u.nama||u.noSkb||u.username||'Pengguna';el('topRole').textContent=u.jawatan||u.role||'Pengguna'}}catch(e){console.warn(e)}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script src="sidebar.js"></script>
</body></html>
